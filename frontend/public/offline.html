<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07020a" />
    <title>Offline | Brigid</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #07020a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #100914;
        text-align: left;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 500;
      }
      p {
        margin: 0 0 20px;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.55;
      }
      button {
        min-height: 44px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #d3e7f1;
        color: #07020a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brigid needs a connection</h1>
      <p>
        You are currently offline. Reconnect to chat with Brigid, inspect
        invoices, or confirm pending approvals.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
